<script>





    fetch("announcementlstweel.json")
        .then(res => res.json())
        .then(datas => {
            const containers = document.getElementById("week-announcements");

            datas.forEach(item => {
                const announcementls = document.createElement("div");
                announcementls.className = "w-full border border-gray-300 p-4 mb-4 rounded";

                announcementls.innerHTML = `
            <div class="announcement  items-start gap-3 py-1.5">
                <div class="left mb-4">
                    <h1 class="font-semibold">${item.title}</h1>
                    <p class="text-[12px] text-gray-600">
                        ${item.description}
                    </p>
                </div>
                <div class="img  w-full h-[100px]">
                    <img src="${item.img}">
                </div>
            </div>
            <hr class="border-t border-gray-300 my-3">
        `;

                containers.appendChild(announcementls);
            });
        });







    fetch("announcement.json")
        .then(res => res.json())
        .then(data => {
            const container = document.getElementById("announcement-container");

            // Show only featured announcements
            const featured = data.filter(item => item.is_featured);

            featured.forEach(item => {
                const announcement = document.createElement("div");
                announcement.className = "py-6 border-b border-gray-300";

                announcement.innerHTML = `
        <h2 class="text-2xl font-semibold text-gray-900 mb-2">
          ${item.title}
        </h2>

        <div class="text-sm text-gray-600 mb-3">
          <span>${item.date}</span> · 
          <span>${item.category}</span>
        </div>

        <p class="text-gray-800 leading-relaxed">
          ${item.description}
        </p>
      `;

                container.appendChild(announcement);
            });
        });

</script>
